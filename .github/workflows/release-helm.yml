name: Validate and release Helm chart

on:
  pull_request:
    paths:
      - charts/investigator-platform/**
      - .github/workflows/release-helm.yml
  push:
    tags: [chart-v*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Set release metadata
        if: startsWith(github.ref, 'refs/tags/chart-v')
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#chart-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid chart release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          sed -i -E "s/^version:.*/version: ${version}/" charts/investigator-platform/Chart.yaml
          sed -i -E "s/^appVersion:.*/appVersion: \"${version}\"/" charts/investigator-platform/Chart.yaml
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Lint and render
        run: |
          helm lint charts/investigator-platform
          helm template test charts/investigator-platform --namespace investigator-system >/dev/null
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/chart-v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Package and push
        if: startsWith(github.ref, 'refs/tags/chart-v')
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          archive="dist/investigator-platform-${RELEASE_VERSION}.tgz"
          helm package charts/investigator-platform --destination dist

          chart_version="$(helm show chart "$archive" | sed -n 's/^version: //p')"
          app_version="$(helm show chart "$archive" | sed -n 's/^appVersion: //p' | tr -d '\"')"
          test "$chart_version" = "$RELEASE_VERSION"
          test "$app_version" = "$RELEASE_VERSION"
          helm template test "$archive" --namespace investigator-system >/dev/null

          helm push "$archive" "oci://ghcr.io/${{ github.repository_owner }}/charts"
