name: Build investigator

on:
  pull_request:
    paths:
      - apps/investigator/**
      - Cargo.toml
      - Cargo.lock
      - docker/Dockerfile.app
      - .github/workflows/_build-app.yml
      - .github/workflows/build-investigator.yml
  push:
    branches: [main]
    tags: [investigator-v*]
    paths:
      - apps/investigator/**
      - Cargo.toml
      - Cargo.lock
      - docker/Dockerfile.app
      - .github/workflows/_build-app.yml
      - .github/workflows/build-investigator.yml
  workflow_dispatch:

jobs:
  image:
    uses: ./.github/workflows/_build-app.yml
    permissions: {contents: read, packages: write}
    with: {package: investigator, binary: investigator, image: investigator}
    secrets: inherit
