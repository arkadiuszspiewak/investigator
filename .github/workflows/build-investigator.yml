name: Build investigator

on:
  pull_request:
    paths:
      - apps/investigator/**
      - Cargo.toml
      - docker/Dockerfile.app
      - .github/workflows/_build-app.yml
      - .github/workflows/build-investigator.yml
  push:
    tags: [investigator-v*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: ./.github/workflows/_build-app.yml
    permissions: {contents: read, packages: write}
    with: {package: investigator, binary: investigator, image: investigator}
    secrets: inherit
