name: Reusable MCP server image

on:
  workflow_call:
    inputs:
      package:
        description: Cargo package to build
        required: true
        type: string
      binary:
        description: Binary produced by the package
        required: true
        type: string
      image:
        description: Image name below ghcr.io/<owner>/
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}},match=^${{ inputs.image }}-v(.*)$
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          build-args: |
            PACKAGE=${{ inputs.package }}
            BINARY=${{ inputs.binary }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.package }}
          cache-to: type=gha,mode=max,scope=${{ inputs.package }}
