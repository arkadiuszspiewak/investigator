name: Release components

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_existing_releases:
        description: Dispatch artifact workflows for every version in the release manifest
        type: boolean
        default: false

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v5
        if: >-
          steps.release.outputs.releases_created == 'true' ||
          inputs.publish_existing_releases == true

      - name: Start artifact workflows
        if: >-
          steps.release.outputs.releases_created == 'true' ||
          inputs.publish_existing_releases == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
          RELEASED_PATHS: ${{ steps.release.outputs.paths_released }}
          PUBLISH_EXISTING_RELEASES: ${{ inputs.publish_existing_releases }}
        run: |
          set -euo pipefail

          released_paths="$RELEASED_PATHS"
          if [[ "$PUBLISH_EXISTING_RELEASES" == "true" ]]; then
            released_paths=$(jq -c 'keys' .release-please-manifest.json)
          fi

          while IFS= read -r path; do
            case "$path" in
              apps/investigator)
                workflow="build-investigator.yml"
                ;;
              apps/investigator-cli)
                workflow="build-investigator-cli.yml"
                ;;
              apps/investigator-alerts)
                workflow="build-investigator-alerts.yml"
                ;;
              docker)
                workflow="build-agent.yml"
                ;;
              servers/kubernetes-mcp)
                workflow="build-kubernetes-mcp.yml"
                ;;
              servers/prometheus-mcp)
                workflow="build-prometheus-mcp.yml"
                ;;
              servers/alertmanager-mcp)
                workflow="build-alertmanager-mcp.yml"
                ;;
              charts/investigator-platform)
                workflow="release-helm.yml"
                ;;
              *)
                echo "Unsupported released component path: $path" >&2
                exit 1
                ;;
            esac

            tag=$(jq -r --arg key "${path}--tag_name" '.[$key]' <<<"$RELEASE_OUTPUTS")
            if [[ -z "$tag" || "$tag" == "null" ]]; then
              component=$(jq -r --arg path "$path" '.packages[$path].component' release-please-config.json)
              version=$(jq -r --arg path "$path" '.[$path]' .release-please-manifest.json)
              if [[ -z "$component" || "$component" == "null" || -z "$version" || "$version" == "null" ]]; then
                echo "Could not determine the existing release tag for $path" >&2
                exit 1
              fi
              tag="${component}-v${version}"
            fi

            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$tag"
            echo "Dispatched $workflow for $tag"
          done < <(jq -r '.[]' <<<"$released_paths")
