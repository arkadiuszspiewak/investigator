name: Build investigator-agent-codex

on:
  pull_request:
    paths:
      - agents/codex/**
      - .github/workflows/_build-agent.yml
      - .github/workflows/build-agent-codex.yml
  push:
    branches: [main]
    tags: [agent-codex-v*]
    paths:
      - agents/codex/**
      - .github/workflows/_build-agent.yml
      - .github/workflows/build-agent-codex.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/_build-agent.yml
    with:
      agent: codex
    secrets: inherit
