name: Build and release investigator-cli

on:
  pull_request:
    paths:
      - apps/investigator-cli/**
      - apps/investigator/src/crd.rs
      - Cargo.toml
      - install.sh
      - .github/workflows/build-investigator-cli.yml
  push:
    tags: [investigator-cli-v*]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries avoid depending on the user's glibc version.
          - {runner: ubuntu-latest, target: x86_64-unknown-linux-musl, command: cross}
          - {runner: ubuntu-latest, target: aarch64-unknown-linux-musl, command: cross}
          - {runner: macos-15, target: x86_64-apple-darwin, command: cargo}
          - {runner: macos-14, target: aarch64-apple-darwin, command: cargo}
          - {runner: windows-latest, target: x86_64-pc-windows-msvc, command: cargo}
    runs-on: ${{ matrix.runner }}
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.command == 'cross'
        uses: taiki-e/install-action@cross
      - name: Build
        shell: bash
        run: ${{ matrix.command }} build --locked --release --package investigator-cli --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          executable="investigator-cli"
          if [[ "${{ matrix.target }}" == *windows* ]]; then executable="investigator-cli.exe"; fi
          mkdir dist
          cp "target/${{ matrix.target }}/release/${executable}" "dist/${executable}"
          tar -C dist -czf "investigator-cli-${{ matrix.target }}.tar.gz" "${executable}"
      - uses: actions/upload-artifact@v4
        with:
          name: investigator-cli-${{ matrix.target }}
          path: investigator-cli-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/investigator-cli-v')
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: investigator-cli-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum investigator-cli-*.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/investigator-cli-*.tar.gz
            dist/checksums.txt
