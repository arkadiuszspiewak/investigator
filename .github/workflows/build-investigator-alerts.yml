name: Build investigator-alerts
on:
  pull_request:
    paths: [apps/investigator-alerts/**, apps/investigator/src/crd.rs, Cargo.toml, docker/Dockerfile.app, .github/workflows/_build-app.yml, .github/workflows/build-investigator-alerts.yml]
  push:
    tags: [investigator-alerts-v*]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image:
    uses: ./.github/workflows/_build-app.yml
    permissions: {contents: read, packages: write}
    with: {package: investigator-alerts, binary: investigator-alerts, image: investigator-alerts}
    secrets: inherit
