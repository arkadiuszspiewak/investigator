name: Build agent image

on:
  workflow_call:
    inputs:
      agent:
        description: Agent directory and image suffix
        required: true
        type: string

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/investigator-agent-${{ inputs.agent }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}},match=^agent-${{ inputs.agent }}-v(.*)$
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/${{ inputs.agent }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=investigator-agent-${{ inputs.agent }}
          cache-to: type=gha,mode=max,scope=investigator-agent-${{ inputs.agent }}
