apiVersion: investigator.openai.com/v1alpha1
kind: Investigation
metadata:
  name: checkout-latency
  namespace: investigations
spec:
  query: >-
    Determine why checkout latency increased in the last 30 minutes. Correlate
    Kubernetes events, Prometheus metrics, and recent Argo CD changes. Report
    evidence and perform only safe, reversible remediation.
  agentImage: ghcr.io/arkadiuszspiewak/investigator-agent:latest
  auth:
    apiKeySecretRef:
      name: openai-api-key
      key: api-key
  serviceAccountName: investigator-agent
