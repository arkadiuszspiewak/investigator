[workspace]
members = ["apps/investigator", "apps/investigator-alerts", "apps/investigator-cli", "crates/mcp-runtime", "servers/alertmanager-mcp", "servers/kubernetes-mcp", "servers/prometheus-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
axum = "0.8.9"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["v1_34"] }
kube = { version = "4.2", features = ["client", "derive", "runtime", "rustls-tls"] }
rmcp = { version = "3.1.2", features = ["server", "transport-streamable-http-server"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1", features = ["full", "io-std", "io-util", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
