apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: investigations.investigator.openai.com
spec:
  group: investigator.openai.com
  scope: Namespaced
  names:
    kind: Investigation
    plural: investigations
    singular: investigation
    shortNames: [inv]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [query, auth]
              properties:
                query:
                  type: string
                  minLength: 1
                questions:
                  type: array
                  default: []
                  items:
                    type: object
                    required: [id, query]
                    properties:
                      id: {type: string, minLength: 1}
                      query: {type: string, minLength: 1}
                auth:
                  type: object
                  oneOf:
                    - required: [apiKeySecretRef]
                    - required: [authJsonSecretRef]
                  properties:
                    apiKeySecretRef:
                      type: object
                      required: [name, key]
                      properties:
                        name: {type: string, minLength: 1}
                        key: {type: string, minLength: 1}
                    authJsonSecretRef:
                      type: object
                      required: [name, key]
                      properties:
                        name: {type: string, minLength: 1}
                        key: {type: string, minLength: 1}
                serviceAccountName:
                  type: string
                  default: investigator-agent
                mcpServers:
                  type: array
                  default: []
                  items:
                    type: object
                    required: [name, url]
                    properties:
                      name: {type: string}
                      url: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                jobName: {type: string}
                message: {type: string}
                result: {type: string}
                answers:
                  type: array
                  items:
                    type: object
                    required: [questionId, result]
                    properties:
                      questionId: {type: string}
                      result: {type: string}
                observedGeneration: {type: integer, format: int64}
