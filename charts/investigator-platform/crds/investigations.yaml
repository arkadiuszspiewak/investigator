apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: investigations.investigator.openai.com
spec:
  group: investigator.openai.com
  scope: Namespaced
  names:
    kind: Investigation
    plural: investigations
    singular: investigation
    shortNames: [inv]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                agentImage:
                  type: string
                  default: ghcr.io/example/investigator-agent:latest
                serviceAccountName:
                  type: string
                  default: investigator-agent
                mcpServers:
                  type: array
                  default: []
                  items:
                    type: object
                    required: [name, url]
                    properties:
                      name: {type: string}
                      url: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                jobName: {type: string}
                message: {type: string}
                observedGeneration: {type: integer, format: int64}
