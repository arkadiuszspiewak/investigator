nameOverride: ""
fullnameOverride: ""

investigator:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/arkadiuszspiewak/investigator
    tag: ""
    digest: ""
    # Always is required for mutable tags such as main. Override to
    # IfNotPresent when using an immutable version tag or digest.
    pullPolicy: Always
  imagePullSecrets: []
  serviceAccount: {create: true, name: "", annotations: {}}
  podAnnotations: {}
  podLabels: {}
  env: []
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  rbac:
    create: true

# Global configuration for every short-lived agent Job. Select the runtime image
# once per cluster; Investigation resources cannot override it.
agent:
  # Runtime controls how the controller starts the selected image. It does not
  # select or infer the image repository.
  runtime: codex
  image:
    repository: ghcr.io/arkadiuszspiewak/investigator-agent-codex
    tag: "0.1.0"
    digest: ""
  provider: {type: openai, model: gpt-5.6-terra, api: "", region: "", projectId: ""}
  auth:
    # apiKey, authJson, or workloadIdentity (Bedrock only).
    type: apiKey
    apiKeySecretRef: {name: openai-api-key, key: api-key}
    authJsonSecretRef: {name: "", key: ""}
  serviceAccount: {create: true, name: investigator-agent, annotations: {}}
  job:
    nodeSelector: {}
    tolerations: []
    affinity: {}

# Long-running applications that consume the Investigation API. Copy an entry
# to add future webhook, scheduler, or chat integrations without new templates.
apps:
  alerts:
    enabled: false
    # Empty means the Helm release namespace. RBAC is created in this namespace.
    investigationNamespace: ""
    # With Slack App credentials, post a compact parent alert and put the
    # investigation result in its thread. Keep false for independent/native
    # Alertmanager Slack delivery.
    relayMode: false
    image: {repository: ghcr.io/arkadiuszspiewak/investigator-alerts, tag: "", digest: "", pullPolicy: IfNotPresent}
    imagePullSecrets: []
    replicas: 1
    serviceAccount: {create: true, name: "", annotations: {}}
    service: {enabled: true, type: ClusterIP, port: 8080}
    env:
      - name: INVESTIGATION_QUERY
        value: "Investigate this active Kubernetes alert and determine its likely cause: {{alert}}"
      # Configure Slack without putting its URL in values:
      # - {name: SLACK_WEBHOOK_URL, valueFrom: {secretKeyRef: {name: slack-webhook, key: url}}}
      # Or use a Slack App. Set both values and do not set SLACK_WEBHOOK_URL:
      # - {name: SLACK_BOT_TOKEN, valueFrom: {secretKeyRef: {name: slack-app, key: bot-token}}}
      # - {name: SLACK_CHANNEL, value: "C0123456789"}
    rbac:
      create: true
      rules:
        - apiGroups: [investigator.openai.com]
          resources: [investigations]
          verbs: [get, create, patch]
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
    securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
    resources: {requests: {cpu: 25m, memory: 48Mi}, limits: {cpu: 250m, memory: 128Mi}}
    nodeSelector: {}
    tolerations: []
    affinity: {}

# Copy an entry to add a provider. Every enabled item renders independently and
# is included in the controller-owned MCP registry used by every investigation.
mcpServers:
  kubernetes:
    enabled: true
    image: {repository: ghcr.io/arkadiuszspiewak/kubernetes-mcp, tag: "", digest: "", pullPolicy: IfNotPresent}
    imagePullSecrets: []
    replicas: 1
    port: 8080
    path: /mcp
    stateless: true
    env: []
    serviceAccount: {create: true, name: "", annotations: {}}
    rbac:
      create: true
      rules:
        - apiGroups: [""]
          resources: [namespaces, nodes, persistentvolumes, pods, events, services, endpoints, configmaps, persistentvolumeclaims, serviceaccounts]
          verbs: [get, list, watch]
        - apiGroups: [""]
          resources: [pods/log]
          verbs: [get]
        - apiGroups: [apps]
          resources: [deployments, statefulsets, daemonsets, replicasets, controllerrevisions]
          verbs: [get, list, watch]
        - apiGroups: [batch]
          resources: [jobs, cronjobs]
          verbs: [get, list, watch]
        - apiGroups: [autoscaling]
          resources: [horizontalpodautoscalers]
          verbs: [get, list, watch]
        - apiGroups: [networking.k8s.io]
          resources: [ingresses, ingressclasses, networkpolicies]
          verbs: [get, list, watch]
        - apiGroups: [policy]
          resources: [poddisruptionbudgets]
          verbs: [get, list, watch]
        - apiGroups: [apiextensions.k8s.io]
          resources: [customresourcedefinitions]
          verbs: [get, list, watch]
        - apiGroups: [metrics.k8s.io]
          resources: [pods, nodes]
          verbs: [get, list]
        - apiGroups: [helm.toolkit.fluxcd.io]
          resources: [helmreleases]
          verbs: [get, list, watch]
        - apiGroups: [source.toolkit.fluxcd.io]
          resources: [gitrepositories, helmrepositories, helmcharts, ocirepositories]
          verbs: [get, list, watch]
        - apiGroups: [kustomize.toolkit.fluxcd.io]
          resources: [kustomizations]
          verbs: [get, list, watch]
      extraRules: []
    podSecurityContext: &serverPodSecurityContext
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile: {type: RuntimeDefault}
    securityContext: &serverSecurityContext
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
    resources: &serverResources
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
    health: &serverHealth
      livenessProbe:
        tcpSocket: {port: 8080}
        initialDelaySeconds: 5
        periodSeconds: 10
      readinessProbe:
        tcpSocket: {port: 8080}
        initialDelaySeconds: 2
        periodSeconds: 5
    nodeSelector: &serverNodeSelector {}
    tolerations: &serverTolerations []
    affinity: &serverAffinity {}
    extraLabels: {}
    extraAnnotations: {}

  prometheus:
    enabled: false
    image: {repository: ghcr.io/arkadiuszspiewak/prometheus-mcp, tag: "", digest: "", pullPolicy: IfNotPresent}
    imagePullSecrets: []
    replicas: 1
    port: 8080
    path: /mcp
    stateless: true
    env:
      - name: PROMETHEUS_URL
        value: http://prometheus-operated.monitoring.svc.cluster.local:9090
      # Optionally provide PROMETHEUS_BEARER_TOKEN with valueFrom.secretKeyRef.
      - name: PROMETHEUS_TIMEOUT_SECONDS
        value: "30"
    serviceAccount: {create: true, name: "", annotations: {}}
    rbac: {create: false, rules: [], extraRules: []}
    podSecurityContext: *serverPodSecurityContext
    securityContext: *serverSecurityContext
    resources: *serverResources
    health: *serverHealth
    nodeSelector: *serverNodeSelector
    tolerations: *serverTolerations
    affinity: *serverAffinity
    extraLabels: {}
    extraAnnotations: {}

  alertmanager:
    enabled: false
    image: {repository: ghcr.io/arkadiuszspiewak/alertmanager-mcp, tag: "", digest: "", pullPolicy: IfNotPresent}
    imagePullSecrets: []
    replicas: 1
    port: 8080
    path: /mcp
    stateless: true
    env:
      - name: ALERTMANAGER_URL
        value: http://alertmanager-operated.monitoring.svc.cluster.local:9093
      # Optionally provide ALERTMANAGER_BEARER_TOKEN with valueFrom.secretKeyRef.
      - name: ALERTMANAGER_TIMEOUT_SECONDS
        value: "30"
    serviceAccount: {create: true, name: "", annotations: {}}
    rbac: {create: false, rules: [], extraRules: []}
    podSecurityContext: *serverPodSecurityContext
    securityContext: *serverSecurityContext
    resources: *serverResources
    health: *serverHealth
    nodeSelector: *serverNodeSelector
    tolerations: *serverTolerations
    affinity: *serverAffinity
    extraLabels: {}
    extraAnnotations: {}

  argo:
    enabled: false
    image: {repository: ghcr.io/arkadiuszspiewak/argo-mcp, tag: "", digest: "", pullPolicy: IfNotPresent}
    imagePullSecrets: []
    replicas: 1
    port: 8080
    path: /mcp
    stateless: true
    env: []
    serviceAccount: {create: true, name: "", annotations: {}}
    rbac: {create: false, rules: [], extraRules: []}
    podSecurityContext: *serverPodSecurityContext
    securityContext: *serverSecurityContext
    resources: *serverResources
    health: *serverHealth
    nodeSelector: *serverNodeSelector
    tolerations: *serverTolerations
    affinity: *serverAffinity
    extraLabels: {}
    extraAnnotations: {}
