{{- $root := . -}}
{{- $mcpServers := list -}}
{{- range $name, $server := .Values.mcpServers -}}
{{- if $server.enabled -}}
{{- $ctx := dict "root" $root "name" $name "server" $server -}}
{{- $serverName := include "investigator-platform.serverName" $ctx -}}
{{- $url := printf "http://%s.%s.svc.cluster.local:%v%s" $serverName $root.Release.Namespace $server.port $server.path -}}
{{- $mcpServers = append $mcpServers (dict "name" $name "url" $url) -}}
{{- end -}}
{{- end -}}
{{- if .Values.investigator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "investigator-platform.fullname" . }}
  labels:
    {{- include "investigator-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.investigator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "investigator-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        {{- toYaml .Values.investigator.podAnnotations | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "investigator-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        {{- with .Values.investigator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "investigator-platform.controllerServiceAccount" . }}
      {{- with .Values.investigator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.investigator.podSecurityContext | nindent 8 }}
      containers:
        - name: investigator
          image: {{ include "investigator-platform.image" (dict "root" . "image" .Values.investigator.image) | quote }}
          imagePullPolicy: {{ .Values.investigator.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.investigator.securityContext | nindent 12 }}
          env:
            - name: INVESTIGATOR_AGENT_IMAGE
              value: {{ include "investigator-platform.image" (dict "root" . "image" .Values.agent.image) | quote }}
            - name: INVESTIGATOR_AGENT_SERVICE_ACCOUNT
              value: {{ include "investigator-platform.agentServiceAccount" . | quote }}
            - name: INVESTIGATOR_AGENT_PROVIDER
              value: {{ .Values.agent.provider.type | quote }}
            - name: INVESTIGATOR_AGENT_MODEL
              value: {{ required "agent.provider.model is required" .Values.agent.provider.model | quote }}
            - name: INVESTIGATOR_AGENT_AUTH_TYPE
              value: {{ .Values.agent.auth.type | quote }}
            {{- if eq .Values.agent.provider.type "bedrock" }}
            - name: INVESTIGATOR_AGENT_REGION
              value: {{ required "agent.provider.region is required for Bedrock" .Values.agent.provider.region | quote }}
            - name: INVESTIGATOR_AGENT_PROJECT_ID
              value: {{ required "agent.provider.projectId is required for Bedrock" .Values.agent.provider.projectId | quote }}
            {{- end }}
            {{- if eq .Values.agent.auth.type "apiKey" }}
            - name: INVESTIGATOR_AGENT_API_KEY_SECRET_NAME
              value: {{ required "agent.auth.apiKeySecretRef.name is required" .Values.agent.auth.apiKeySecretRef.name | quote }}
            - name: INVESTIGATOR_AGENT_API_KEY_SECRET_KEY
              value: {{ required "agent.auth.apiKeySecretRef.key is required" .Values.agent.auth.apiKeySecretRef.key | quote }}
            {{- else if eq .Values.agent.auth.type "authJson" }}
            - name: INVESTIGATOR_AGENT_AUTH_JSON_SECRET_NAME
              value: {{ required "agent.auth.authJsonSecretRef.name is required" .Values.agent.auth.authJsonSecretRef.name | quote }}
            - name: INVESTIGATOR_AGENT_AUTH_JSON_SECRET_KEY
              value: {{ required "agent.auth.authJsonSecretRef.key is required" .Values.agent.auth.authJsonSecretRef.key | quote }}
            {{- end }}
            - name: INVESTIGATOR_MCP_SERVERS
              value: {{ $mcpServers | toJson | quote }}
            - name: INVESTIGATOR_AGENT_JOB_NODE_SELECTOR
              value: {{ .Values.agent.job.nodeSelector | toJson | quote }}
            - name: INVESTIGATOR_AGENT_JOB_AFFINITY
              value: {{ ternary (.Values.agent.job.affinity | toJson) "null" (not (empty .Values.agent.job.affinity)) | quote }}
            - name: INVESTIGATOR_AGENT_JOB_TOLERATIONS
              value: {{ .Values.agent.job.tolerations | toJson | quote }}
            {{- with .Values.investigator.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.investigator.resources | nindent 12 }}
      {{- with .Values.investigator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.investigator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.investigator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
